version: '3.9'

services:
  nginx:
    build:
      context: nginx
#    depends_on:
#      - wp
#      - api
#      - client
    container_name: nginx
    restart: always
    volumes:
      - ./nginx/conf/:/etc/nginx/conf.d/
      - ./logs/nginx/:/var/log/nginx/
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
#      - ./goaccess/www:/var/www/goaccess/
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw
      - ./logs/certbot/:/var/log/letsencrypt
    depends_on:
      - nginx
    # docker-compose up --force-recreate --no-deps certbot
    command: >-
      certonly -v
      --cert-name vechorka.ru
      --reinstall
      --agree-tos 
      --no-eff-email
      --force-renewal
      --webroot --webroot-path=/var/www/certbot
      --email vechorka@vechorka.ru
      -d vechorka.ru,api.vechorka.ru,admin.vechorka.ru,phpmyadmin.vechorka.ru

#  goaccess:
#    image: allinurl/goaccess:latest
#    container_name: goaccess
#    restart: always
#    volumes:
#      - ./logs/nginx/:/var/log/nginx:ro
#      - ./goaccess/www:/var/www/goaccess:rw
#    ports:
#      - "7890:7890"
#    command: "/var/log/nginx/access.log --log-format=COMBINED -o /var/www/goaccess/index.html --real-time-html --ws-url=wss://phpmyadmin.vechorka.ru:443/goaccess/ws --port=7890"
#    networks:
#      - app-network

  db:
    image: mysql:5.7
    container_name: db
    volumes:
      - ./mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-password}
      - MYSQL_DATABASE=${DB_NAME:-db}
      - MYSQL_USER=${DB_USER:-db_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
    restart: always
    command: '--default-authentication-plugin=mysql_native_password'
    networks:
      - app-network

  wp:
    image: wordpress
    container_name: wp
    volumes:
      - ./admin.wp/config/php.conf.ini:/usr/local/etc/php/conf.d/php.ini
      - ./admin.wp/wordpress:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=${DB_HOST:-db}
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_DB_USER=${DB_USER:-root}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD:-password}
      - WORDPRESS_TABLE_PREFIX=wp_
      - WORDPRESS_DEBUG=${WORDPRESS_DEBUG:-0}
      - CLIENT_REVALIDATE_URL=${CLIENT_REVALIDATE_URL:-revalidate-url}
      - CLIENT_PREVIEW_URL=${CLIENT_PREVIEW_URL:-preview-url}
      - CLIENT_SECRET=${CLIENT_SECRET:-secret-key}
    restart: always
#    deploy:
#      resources:
#        limits:
#          memory: 180M
#        reservations:
#          memory: 128M
    depends_on:
      - db
    networks:
      - app-network

  api:
    build:
      context: api.nest
      target: production
    container_name: api
    depends_on:
      - db
    env_file:
      - .env
    restart: always
#    deploy:
#      resources:
#        limits:
#          memory: 180M
#        reservations:
#          memory: 128M
    ports:
      - "5000:5000"
    networks:
      - app-network

  client:
    build:
      context: client.next
      dockerfile: ./Dockerfile
      args:
        CLIENT_HOST: ${CLIENT_HOST}
        OLD_HOST: ${OLD_HOST}
        API_HOST: ${API_HOST}
        UPLOAD_HOST: ${UPLOAD_HOST}
        API_KEY: ${API_KEY}
        CLIENT_SECRET: ${CLIENT_SECRET}
    container_name: client
#    depends_on:
#      - api
#      - wp
    env_file:
      - .env
    restart: always
#    deploy:
#      resources:
#        limits:
#          memory: 180M
#        reservations:
#          memory: 128M
    ports:
      - "3000:3000"
      - "9229:9229"
      - "9230:9230"
    networks:
      - app-network

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge