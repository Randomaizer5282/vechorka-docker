#######################################
#client
#######################################
server {
    listen [::]:80;
    listen 80;
    server_name new.vechorka.ru;
    return 301 https://$host$request_uri;
}

server {
    server_name www.new.vechorka.ru;
    return 301 $scheme://new.vechorka.ru$request_uri;
}

#server {
#    listen 443 ssl;
#    listen [::]:443 ssl http2;
#    ssl_certificate /etc/nginx/ssl/live/vechorka.ru/fullchain.pem;
#    ssl_certificate_key /etc/nginx/ssl/live/vechorka.ru/privkey.pem;
#    server_name www.new.vechorka.ru;
#    return 301 https://new.vechorka.ru$request_uri;
#}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name new.vechorka.ru www.new.vechorka.ru;
    server_tokens off;
    client_max_body_size 64M;

    location /.well-known/acme-challenge {
      root /var/www/certbot;
      default_type text/plain;
    }

    ssl_certificate /etc/nginx/ssl/live/vechorka.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vechorka.ru/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;

    location /_next/static {
      proxy_cache STATIC;
      proxy_pass http://client:3000;

      # For testing cache - remove before deploying to production
      add_header X-Cache-Status $upstream_cache_status;
    }

    location  ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|ttf|woff|woff2)$ {
            proxy_cache STATIC;
            proxy_ignore_headers Cache-Control;
            proxy_cache_valid 60m;
            proxy_pass http://client:3000;

            # For testing cache - remove before deploying to production
            add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass http://client:3000;
    }
}

