      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://api:5000;
      }
}

#######################################
#wp-admin
#######################################
server {
    listen [::]:80;
    listen 80;
    server_name admin.vechorka.ru;
    return 301 https://$host$request_uri;
}

server {
    server_name www.admin.vechorka.ru;
    return 301 $scheme://admin.vechorka.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.vechorka.ru www.admin.vechorka.ru;
    server_tokens off;
    client_max_body_size 64M;

    ssl_certificate /etc/nginx/ssl/live/vechorka.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vechorka.ru/privkey.pem;

    location / {
      auth_basic "Restricted Access!";
      auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://wp;
    }

    location ~*/wp-content/uploads/.*\.(png|jpg|jpeg|gif|svg|doc|docx|pdf) {
      expires max;
      proxy_pass http://wp;
        #log_not_found off;
    }

    location /.well-known/acme-challenge {
      root /var/www/certbot;
      default_type text/plain;
    }
}

