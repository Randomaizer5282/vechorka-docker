#api
#######################################
server {
    listen [::]:80;
    listen 80;
    server_name api.vechorka.ru;
    return 301 https://$host$request_uri;
}

server {
    server_name www.api.vechorka.ru;
    return 301 $scheme://api.vechorka.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vechorka.ru www.api.vechorka.ru;
    server_tokens off;
    client_max_body_size 64M;

    ssl_certificate /etc/nginx/ssl/live/vechorka.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vechorka.ru/privkey.pem;

    location /.well-known/acme-challenge {
      root /var/www/certbot;
      default_type text/plain;
    }

    location / {
      proxy_http_version 1.1;
